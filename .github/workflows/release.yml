name: Release check

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tag-matches-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag must equal the manifest version
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/irhvac/manifest.json'))['version'])")
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "$version" ]; then
            echo "Release tag $tag differs from manifest version $version" >&2
            exit 1
          fi
